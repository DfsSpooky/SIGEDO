services:
  web:
    build: .
    env_file:
      - ${APP_ENV_FILE:-.env}
    restart: unless-stopped
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "gestion_docentes.asgi:application"]
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ${HOST_STATIC_DIR}:/app/public_html/static
      - ${HOST_MEDIA_DIR}:/app/public_html/media
      - ${HOST_FIREBASE_KEY}:/run/secrets/serviceAccountKey.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
