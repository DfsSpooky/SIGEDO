{% extends 'base.html' %}

{% block title %}Mi Calendario de Horarios{% endblock %}

{% block breadcrumb %}Mi Calendario{% endblock %}

{% block content %}
<div class="card bg-base-100 shadow-sm border border-base-300/50">
    <div class="card-body">
        <div class="mb-4">
            <h1 class="text-3xl font-bold text-base-content">Mi Calendario</h1>
            <p class="text-base-content/70 mt-1">Aquí puedes ver todos tus cursos y horarios programados.</p>
        </div>
        <div id="calendar" class="transition-opacity duration-500 opacity-0"></div>
    </div>
</div>

<style>
    /* Estilos para personalizar FullCalendar para que coincida con la nueva estética */
    #calendar {
        opacity: 1 !important; /* Forzar la visibilidad una vez cargado */
    }
    .fc {
        font-family: 'Inter', sans-serif;
        color: hsl(var(--bc)); /* Color de texto base */
    }
    .fc .fc-toolbar-title {
        color: hsl(var(--bc));
        font-weight: 600;
        font-size: 1.25em;
    }
    .fc .fc-button-primary {
        background-color: hsl(var(--p));
        border-color: hsl(var(--p));
        color: hsl(var(--pc));
        transition: background-color 0.2s;
    }
    .fc .fc-button-primary:hover {
        background-color: hsl(var(--pf, hsl(var(--p) / 0.8)));
        border-color: hsl(var(--pf, hsl(var(--p) / 0.8)));
    }
    .fc .fc-button-primary:disabled {
        background-color: hsl(var(--p));
        border-color: hsl(var(--p));
        opacity: 0.4;
    }
    .fc .fc-daygrid-day.fc-day-today {
        background-color: hsl(var(--p) / 0.05);
    }
    .fc .fc-daygrid-day-number, .fc .fc-col-header-cell-cushion {
        color: hsl(var(--bc));
    }
    .fc-event {
        background-color: hsl(var(--b2));
        border: 1px solid hsl(var(--b3));
        color: hsl(var(--bc));
        padding: 4px 6px;
        font-size: 0.8rem;
        border-radius: var(--rounded-btn);
    }
    .fc-event-main {
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .fc-h-event {
        border: 1px solid hsl(var(--b3));
    }
    .fc-v-event {
        box-shadow: none;
    }
    .fc .fc-timegrid-slot-label {
        border-color: hsl(var(--b3));
    }
    .fc .fc-timegrid-slot-lane {
        border-color: hsl(var(--b3));
    }
    .fc .fc-scrollgrid, .fc .fc-theme-standard td, .fc .fc-theme-standard th {
        border-color: hsl(var(--b3));
    }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');

    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        locale: 'es',
        slotMinTime: '07:00:00',
        slotMaxTime: '22:00:00',
        allDaySlot: false,
        events: "{% url 'api:horario_docente' %}",

        eventDidMount: function(info) {
            // Tooltip para eventos
            info.el.setAttribute('data-tip', info.event.title);
            info.el.classList.add('tooltip', 'tooltip-bottom');
        },

        loading: function(isLoading) {
            if (isLoading) {
                calendarEl.classList.add('opacity-50');
            } else {
                calendarEl.classList.remove('opacity-50');
            }
        },

        viewDidMount: function() {
            setTimeout(() => {
                calendarEl.style.opacity = '1';
            }, 50);
        }
    });

    calendar.render();

    // --- Lógica para WebSocket en Tiempo Real ---
    function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsPath = `${protocol}//${window.location.host}/ws/calendar/`;
        const socket = new WebSocket(wsPath);

        socket.onopen = function(e) {
            console.log("Conexión WebSocket para el calendario establecida.");
        };

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            if (data.type === 'horario.update') {
                console.log('Actualización de horario recibida:', data.message);

                const Toast = Swal.mixin({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true,
                    didOpen: (toast) => {
                        toast.addEventListener('mouseenter', Swal.stopTimer)
                        toast.addEventListener('mouseleave', Swal.resumeTimer)
                    }
                });
                Toast.fire({
                    icon: 'info',
                    title: 'Tu horario ha sido actualizado'
                });

                calendar.refetchEvents();
            }
        };

        socket.onclose = function(e) {
            console.error('El WebSocket del calendario se cerró. Intentando reconectar en 5 segundos...');
            setTimeout(function() {
                connectWebSocket();
            }, 5000);
        };

        socket.onerror = function(err) {
            console.error('Error de WebSocket:', err.message, 'Cerrando socket.');
            socket.close();
        };
    }

    connectWebSocket();
});
</script>
{% endblock %}
