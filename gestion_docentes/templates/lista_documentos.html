{% extends 'base.html' %}
{% load static %}

{% block title %}Mi Carpeta Pedagógica{% endblock %}
{% block breadcrumb %}Mi Carpeta Pedagógica{% endblock %}

{% block content %}
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script id="docs-data" type="application/json">
    [
        {% for seccion in documentos_por_seccion %}
        {
            "estadoKey": "{{ seccion.estado_key }}",
            "estadoDisplay": "{{ seccion.estado_display }}",
            "documentos": [
                {% for doc in seccion.documentos %}
                {
                    "isDummy": {% if doc.is_dummy %}true{% else %}false{% endif %},
                    "id": {{ doc.id }},
                    "titulo": "{{ doc.titulo|escapejs }}",
                    "tipo": "{{ doc.tipo_documento.nombre|escapejs }}",
                    "tipoId": {{ doc.tipo_documento.id }},
                    "fechaSubida": "{% if doc.fecha_subida %}{{ doc.fecha_subida|date:'d M, Y' }}{% else %}--{% endif %}",
                    "fechaVencimiento": "{% if doc.fecha_vencimiento %}{{ doc.fecha_vencimiento|date:'d M, Y' }}{% endif %}",
                    "urlUpdate": "{% url 'subir_nueva_version' doc.id %}",
                    {% if not doc.is_dummy %}
                        {% with ver=doc.versiones.first %}
                        "archivoUrl": "{% if ver %}{{ ver.archivo.url }}{% endif %}",
                        "version": "{% if ver %}{{ ver.numero_version }}{% endif %}"
                        {% endwith %}
                    {% else %}
                        "archivoUrl": null,
                        "version": null
                    {% endif %}
                }{% if not forloop.last %},{% endif %}
                {% endfor %}
            ]
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ]
</script>

<div id="react-docs-root" class="min-h-screen bg-gray-50/50 p-6"></div>

{% verbatim %}

    const Icon = ({ name, size = 20, className }) => {
        const icons = {
            'folder-open': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-3.25 7a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg>,

            'download': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            'refresh-cw': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>,
            'check-circle': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,

            'x': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            'calendar': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
        };
        return icons[name] || null;
    };

    const STATUS_CONFIG = {
        'APROBADO': { color: 'bg-green-50 border-green-200 text-green-700', icon: 'check-circle', iconColor: 'text-green-600' },
        'OBSERVADO': { color: 'bg-red-50 border-red-200 text-red-700', icon: 'alert-circle', iconColor: 'text-red-600' },
        'EN_REVISION': { color: 'bg-blue-50 border-blue-200 text-blue-700', icon: 'clock', iconColor: 'text-blue-600' },
        'RECIBIDO': { color: 'bg-yellow-50 border-yellow-200 text-yellow-700', icon: 'inbox', iconColor: 'text-yellow-600' },
        'PENDIENTE': { color: 'bg-gray-50 border-gray-200 text-gray-500', icon: 'alert-circle', iconColor: 'text-gray-400' },
        'DEFAULT': { color: 'bg-gray-50 border-gray-200 text-gray-700', icon: 'inbox', iconColor: 'text-gray-600' }
    };

    const DocumentsManager = () => {
        const [sections, setSections] = useState([]);
        const [selectedDoc, setSelectedDoc] = useState(null);

        useEffect(() => {
            try {
                const rawData = document.getElementById('docs-data').textContent;
                setSections(JSON.parse(rawData));
            } catch (e) {
                console.error("Error parsing docs:", e);
            }
        }, []);

        const getStatusStyle = (key) => STATUS_CONFIG[key] || STATUS_CONFIG['DEFAULT'];
        const hasDocuments = sections.some(s => s.documentos.length > 0);

        return (
            <div className="max-w-7xl mx-auto space-y-8 animate-fade-in-up">
                
                {/* Header */}
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <div>
                        <h1 className="text-2xl font-bold text-gray-900 flex items-center gap-2">
                            <Icon name="folder-open" className="text-blue-600" />
                            Mi Carpeta Pedagógica
                        </h1>
                        <p className="text-gray-500 text-sm mt-1">
                            Estado de tus documentos académicos.
                        </p>
                    </div>
                    
                    <a href="/subir_documento/" className="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-md transition-all hover:shadow-lg transform hover:-translate-y-0.5">
                        <Icon name="plus" size={18} />
                        Subir Documento
                    </a>
                </div>

                {/* Contenido */}
                {hasDocuments ? (
                    <div className="space-y-8">
                        {sections.map((seccion) => {
                            if (seccion.documentos.length === 0) return null;
                            const style = getStatusStyle(seccion.estadoKey);

                            return (
                                <div key={seccion.estadoKey} className="space-y-4">
                                    <div className="flex items-center gap-3">
                                        <div className={`p-2 rounded-lg ${style.color.split(' ')[0]}`}>
                                            <Icon name={style.icon} className={style.iconColor} size={24} />
                                        </div>
                                        <h2 className="text-xl font-bold text-gray-800">
                                            {seccion.estadoDisplay}
                                        </h2>
                                        <span className="bg-gray-100 text-gray-600 text-xs font-bold px-2 py-1 rounded-full border border-gray-200">
                                            {seccion.documentos.length}
                                        </span>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {seccion.documentos.map((doc) => (
                                            <div key={doc.id} className={`bg-white rounded-xl shadow-sm border-l-4 p-5 hover:shadow-md transition-all group ${style.color.split(' ')[1]} ${doc.isDummy ? 'border-dashed border-l-gray-300 opacity-90' : ''}`}>
                                                
                                                <div className="flex justify-between items-start mb-3">
                                                    <span className="inline-block px-2 py-1 bg-gray-100 text-gray-600 text-xs font-semibold rounded uppercase tracking-wide border border-gray-200">
                                                        {doc.tipo}
                                                    </span>
                                                    {!doc.isDummy && doc.version && (
                                                        <span className="text-xs font-mono text-gray-400">v{doc.version}</span>
                                                    )}
                                                </div>

                                                <h3 className={`text-lg font-bold mb-4 line-clamp-2 leading-tight transition-colors ${doc.isDummy ? 'text-gray-500 italic' : 'text-gray-800 group-hover:text-blue-600'}`}>
                                                    {doc.titulo}
                                                </h3>

                                                {!doc.isDummy ? (
                                                    <div className="space-y-2 mb-6">
                                                        <div className="flex items-center gap-2 text-xs text-gray-500">
                                                            <Icon name="calendar" size={14} className="text-gray-400" />
                                                            <span>Subido: <strong>{doc.fechaSubida}</strong></span>
                                                        </div>
                                                        {doc.fechaVencimiento && (
                                                            <div className="flex items-center gap-2 text-xs text-orange-600 bg-orange-50 px-2 py-1 rounded w-fit">
                                                                <Icon name="clock" size={14} />
                                                                <span>Vence: <strong>{doc.fechaVencimiento}</strong></span>
                                                            </div>
                                                        )}
                                                    </div>
                                                ) : (
                                                    <div className="mb-6 text-sm text-gray-400">
                                                        Este documento es requerido pero aún no ha sido cargado.
                                                    </div>
                                                )}

                                                <div className="flex items-center justify-between pt-4 border-t border-gray-100">
                                                    {!doc.isDummy ? (
                                                        <>
                                                            <div className="flex gap-1">
                                                                <button onClick={() => setSelectedDoc(doc)} className="p-2 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Ver"><Icon name="eye" size={18} /></button>
                                                                <a href={doc.archivoUrl} target="_blank" className="p-2 text-gray-500 hover:text-green-600 hover:bg-green-50 rounded-lg transition-colors" title="Descargar"><Icon name="download" size={18} /></a>
                                                            </div>
                                                            <a href={doc.urlUpdate} className="flex items-center gap-1.5 px-3 py-1.5 bg-gray-50 hover:bg-blue-50 text-gray-600 hover:text-blue-700 rounded-lg text-xs font-medium border border-gray-200 hover:border-blue-200 transition-colors">
                                                                <Icon name="refresh-cw" size={14} /> Actualizar
                                                            </a>
                                                        </>
                                                    ) : (
                                                        <a href={`/subir_documento/?tipo_id=${doc.tipoId}`} className="w-full flex items-center justify-center gap-2 px-4 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg text-sm font-bold border border-blue-100 transition-colors">
                                                            <Icon name="upload-cloud" size={16} /> Subir Ahora
                                                        </a>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                ) : (
                    <div className="text-center py-16 bg-white rounded-2xl border border-dashed border-gray-300">
                        <Icon name="alert-circle" size={40} className="text-gray-300 mx-auto mb-4" />
                        <h3 className="text-xl font-bold text-gray-800">No hay categorías definidas</h3>
                        <p className="text-gray-500">Contacta al administrador para configurar los documentos requeridos.</p>
                    </div>
                )}

                {/* Modal de Previsualización */}
                {selectedDoc && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" onClick={() => setSelectedDoc(null)}>
                        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden animate-scale-in" onClick={e => e.stopPropagation()}>
                            <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                                <div><h3 className="font-bold text-gray-800 text-lg">{selectedDoc.titulo}</h3></div>
                                <button onClick={() => setSelectedDoc(null)} className="p-2 hover:bg-gray-200 rounded-full text-gray-500 transition-colors"><Icon name="x" size={24} /></button>
                            </div>
                            <div className="flex-1 bg-gray-100 p-1 relative">
                                <iframe src={selectedDoc.archivoUrl} className="w-full h-full rounded-lg bg-white shadow-inner" title="PDF Preview"></iframe>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('react-docs-root'));
    root.render(<DocumentsManager />);
</script>
{% endverbatim %}

<style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-fade-in { animation: fadeIn 0.2s ease-out; }
    .animate-fade-in-up { animation: fadeInUp 0.4s ease-out; }
    .animate-scale-in { animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
</style>
{% endblock %}
