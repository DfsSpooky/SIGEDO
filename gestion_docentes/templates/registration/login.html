{% extends 'registration/login_base.html' %}
{% load static %}

{% block content %}
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script id="django-context" type="application/json">
    {
        "csrfToken": "{{ csrf_token }}",
        "nextUrl": "{{ next|default:'' }}",
        "errors": {% if form.errors %}true{% else %}false{% endif %},
        "errorMessages": [
            {% for field in form %}
                {% for error in field.errors %}"{{ error }}"{% if not forloop.last %},{% endif %}{% endfor %}
            {% endfor %}
            {% for error in form.non_field_errors %}"{{ error }}"{% if not forloop.last %},{% endif %}{% endfor %}
        ]
    }
</script>

<div id="react-login-root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;
    
    // Iconos como componentes simples
    const UserIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-gray-400"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const LockIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-gray-400"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
    const EyeIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-gray-400 hover:text-gray-600"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>;
    const EyeOffIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-gray-400 hover:text-gray-600"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>;
    const AlertIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-red-500"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;

    const Login = () => {
        const [showPassword, setShowPassword] = useState(false);
        const [isLoading, setIsLoading] = useState(false);
        const [context, setContext] = useState({ csrfToken: '', nextUrl: '', errors: false, errorMessages: [] });

        useEffect(() => {
            const data = JSON.parse(document.getElementById('django-context').textContent);
            setContext(data);
        }, []);

        const handleSubmit = (e) => {
            // No prevenimos el default totalmente, dejamos que el formulario envíe
            // Solo usamos React para estado visual de carga
            setIsLoading(true);
        };

        return (
            <div className="min-h-screen flex bg-white">
                
                {/* Lado Izquierdo - Imagen y Branding */}
                <div className="hidden lg:flex lg:w-1/2 relative bg-gray-900 overflow-hidden">
                    <div className="absolute inset-0 bg-gradient-to-br from-blue-900/90 to-black/80 z-10"></div>
                    <img 
                        src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=2070&auto=format&fit=crop" 
                        alt="University Campus" 
                        className="absolute inset-0 w-full h-full object-cover"
                    />
                    <div className="relative z-20 flex flex-col justify-between h-full p-12 text-white">
                        <div>
                            <div className="flex items-center gap-3 mb-6">
                                <div className="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-500/50">
                                    S
                                </div>
                                <span className="text-2xl font-bold tracking-tight">SIGEDO</span>
                            </div>
                            <h2 className="text-4xl font-bold leading-tight max-w-md">
                                Gestión Académica Inteligente y Eficiente.
                            </h2>
                            <p className="mt-4 text-blue-200 text-lg max-w-sm">
                                Control de asistencia, inventarios y planificación en una sola plataforma unificada.
                            </p>
                        </div>
                        <div className="text-sm text-gray-400">
                            © 2025 Universidad Nacional Daniel Alcides Carrión
                        </div>
                    </div>
                </div>

                {/* Lado Derecho - Formulario de Acceso */}
                <div className="w-full lg:w-1/2 flex items-center justify-center p-8 bg-gray-50">
                    <div className="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
                        
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-900">Bienvenido</h1>
                            <p className="text-gray-500 mt-2">Ingresa tus credenciales para continuar</p>
                        </div>

                        {/* Alerta de Errores de Django */}
                        {context.errors && (
                            <div className="mb-6 p-4 rounded-lg bg-red-50 border border-red-100 flex items-start gap-3 animate-pulse">
                                <AlertIcon />
                                <div className="text-sm text-red-700">
                                    <p className="font-semibold">Error de autenticación</p>
                                    <ul className="list-disc list-inside mt-1">
                                        {context.errorMessages.length > 0 
                                            ? context.errorMessages.map((msg, i) => <li key={i}>{msg}</li>)
                                            : <li>Usuario o contraseña incorrectos.</li>
                                        }
                                    </ul>
                                </div>
                            </div>
                        )}

                        {/* FORMULARIO OFICIAL DE DJANGO (Renderizado por React) */}
                        <form method="post" action="{% url 'login' %}" onSubmit={handleSubmit} className="space-y-6">
                            <input type="hidden" name="csrfmiddlewaretoken" value={context.csrfToken} />
                            {context.nextUrl && <input type="hidden" name="next" value={context.nextUrl} />}

                            <div className="space-y-2">
                                <label className="text-sm font-semibold text-gray-700 block">Usuario / DNI</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <UserIcon />
                                    </div>
                                    <input 
                                        type="text" 
                                        name="username" 
                                        required 
                                        autoFocus
                                        className="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors bg-gray-50 focus:bg-white sm:text-sm"
                                        placeholder="Ej. 10000001"
                                    />
                                </div>
                            </div>

                            <div className="space-y-2">
                                <label className="text-sm font-semibold text-gray-700 block">Contraseña</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <LockIcon />
                                    </div>
                                    <input 
                                        type={showPassword ? "text" : "password"} 
                                        name="password" 
                                        required 
                                        className="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors bg-gray-50 focus:bg-white sm:text-sm"
                                        placeholder="••••••••"
                                    />
                                    <button 
                                        type="button"
                                        onClick={() => setShowPassword(!showPassword)}
                                        className="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer focus:outline-none"
                                    >
                                        {showPassword ? <EyeOffIcon /> : <EyeIcon />}
                                    </button>
                                </div>
                            </div>

                            <div className="flex items-center justify-between">
                                <div className="flex items-center">
                                    <input 
                                        id="remember_me" 
                                        name="remember_me" 
                                        type="checkbox" 
                                        className="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded cursor-pointer" 
                                    />
                                    <label htmlFor="remember_me" className="ml-2 block text-sm text-gray-600 cursor-pointer">
                                        Recordar sesión
                                    </label>
                                </div>
                                <div className="text-sm">
                                    <a href="#" className="font-medium text-blue-600 hover:text-blue-500">
                                        ¿Olvidaste tu contraseña?
                                    </a>
                                </div>
                            </div>

                            <button 
                                type="submit" 
                                disabled={isLoading}
                                className={`w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all transform hover:-translate-y-0.5 ${isLoading ? 'opacity-75 cursor-not-allowed' : ''}`}
                            >
                                {isLoading ? (
                                    <span className="flex items-center gap-2">
                                        <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        Iniciando sesión...
                                    </span>
                                ) : "Ingresar al Sistema"}
                            </button>
                        </form>
                    </div>
                    
                    <div className="lg:hidden absolute bottom-4 text-center w-full text-xs text-gray-400">
                        © 2025 SIGEDO - UNDAC
                    </div>
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('react-login-root'));
    root.render(<Login />);
</script>
{% endblock %}
