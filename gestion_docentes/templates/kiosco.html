<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco de Asistencia | SIGEDO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Tipografía y Fondo Base */
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; overflow: hidden; }
        
        /* Animaciones personalizadas */
        .animate-fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        /* Espejo de cámara */
        #camera-feed { transform: scaleX(-1); }

        /* Scrollbar invisible para listas largas */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Estilos de Estado */
        #right-panel-idle, #right-panel-active { transition: opacity 0.4s ease, transform 0.4s ease; position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .hidden-state { opacity: 0; pointer-events: none; transform: scale(0.95); }
        .visible-state { opacity: 1; pointer-events: auto; transform: scale(1); }
    </style>
</head>
<body class="flex h-screen w-screen text-white">
    {% csrf_token %}

    <div class="w-5/12 h-full relative bg-black shadow-2xl z-10 border-r border-white/10">
        <video id="camera-feed" class="w-full h-full object-cover opacity-80"></video>
        
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-64 h-64 border-2 border-white/30 rounded-full border-dashed animate-pulse-slow relative">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 bg-blue-500 rounded-full shadow-[0_0_15px_rgba(59,130,246,0.8)]"></div>
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 w-4 h-4 bg-purple-500 rounded-full shadow-[0_0_15px_rgba(168,85,247,0.8)]"></div>
            </div>
        </div>

        <div class="absolute top-6 left-6 flex gap-3">
            <div class="bg-black/40 backdrop-blur-md border border-white/10 px-3 py-1.5 rounded-full flex items-center gap-2 text-sm font-medium text-emerald-400 shadow-lg">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                Cámara Activa
            </div>
            <div id="rfid-status" class="bg-black/40 backdrop-blur-md border border-white/10 px-3 py-1.5 rounded-full flex items-center gap-2 text-sm font-medium text-blue-400 shadow-lg opacity-50 transition-opacity">
                <i class="fa-solid fa-wifi"></i> Lector RFID
            </div>
        </div>

        <input type="text" id="rfid-input" class="absolute top-0 left-0 w-full h-full opacity-0 cursor-default" autofocus autocomplete="off">
    </div>

    <div class="w-7/12 h-full bg-slate-900 relative overflow-hidden flex flex-col">
        
        <div class="absolute top-0 right-0 -mt-20 -mr-20 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 -mb-20 -ml-20 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <div id="kiosk-alert" class="absolute top-8 left-1/2 -translate-x-1/2 z-50 transition-all duration-500 transform -translate-y-32 opacity-0">
            <div class="flex items-center gap-4 px-6 py-4 rounded-xl shadow-2xl backdrop-blur-xl border border-white/10 min-w-[320px] justify-center" id="kiosk-alert-content">
                <i id="kiosk-alert-icon" class="text-2xl"></i>
                <p id="kiosk-alert-message" class="font-bold text-lg"></p>
            </div>
        </div>

        <div id="right-panel-idle" class="visible-state flex flex-col items-center justify-center text-center p-12">
            <div class="mb-12 relative">
                <h1 id="clock-time" class="text-8xl font-bold tracking-tighter text-white drop-shadow-2xl">00:00</h1>
                <p id="clock-date" class="text-xl text-slate-400 font-medium mt-2 uppercase tracking-widest">Cargando fecha...</p>
            </div>

            <div class="relative mb-10">
                <div class="absolute inset-0 bg-blue-500/20 blur-2xl rounded-full"></div>
                <div class="relative bg-slate-800/50 border border-slate-700 p-8 rounded-3xl shadow-xl">
                    <i class="fa-solid fa-qrcode text-6xl text-white"></i>
                </div>
            </div>

            <h2 class="text-4xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">Bienvenido</h2>
            <p class="text-slate-400 text-lg max-w-md mx-auto">
                Acerque su <span class="text-white font-semibold">Código QR</span> a la cámara o pase su <span class="text-white font-semibold">Tarjeta RFID</span> por el lector.
            </p>
            
            <div id="scan-feedback" class="mt-8 h-6 text-yellow-400 font-mono text-sm"></div>
        </div>

        <div id="right-panel-active" class="hidden-state flex flex-col p-10 h-full">
            
            <div class="flex items-center gap-6 mb-8 animate-fade-in-up" style="animation-delay: 0ms;">
                <div class="relative">
                    <div class="absolute inset-0 bg-gradient-to-tr from-blue-500 to-purple-500 rounded-full blur opacity-50"></div>
                    <img id="teacher-photo" src="" class="relative w-28 h-28 rounded-full object-cover border-4 border-slate-800 shadow-2xl">
                </div>
                <div>
                    <h2 id="teacher-name" class="text-3xl font-bold text-white leading-tight"></h2>
                    <p id="teacher-dni" class="text-slate-400 text-lg mt-1 font-mono"></p>
                </div>
                <button onclick="resetKiosk()" class="ml-auto bg-slate-800 hover:bg-slate-700 text-white p-4 rounded-xl transition-colors border border-slate-700 group">
                    <i class="fa-solid fa-xmark text-xl group-hover:rotate-90 transition-transform duration-300"></i>
                </button>
            </div>

            <div class="h-px w-full bg-gradient-to-r from-transparent via-slate-700 to-transparent mb-8"></div>

            <div id="attendance-actions" class="flex-1 overflow-y-auto no-scrollbar space-y-4 pr-2">
                </div>

            <div class="mt-6 text-center">
                <div class="w-full bg-slate-800 h-1 rounded-full overflow-hidden">
                    <div id="reset-progress" class="bg-blue-500 h-full w-full origin-left transition-transform duration-[10000ms] ease-linear"></div>
                </div>
                <p class="text-xs text-slate-500 mt-2">La sesión se cerrará automáticamente en 10 segundos</p>
            </div>
        </div>

    </div>

    <canvas id="snapshot-canvas" class="hidden"></canvas>

    <script>
        // --- CONFIGURACIÓN E INICIALIZACIÓN ---
        const video = document.getElementById('camera-feed');
        const canvasElement = document.getElementById('snapshot-canvas');
        const canvas = canvasElement.getContext('2d');
        const rfidInput = document.getElementById('rfid-input');
        
        // Elementos UI
        const panelIdle = document.getElementById('right-panel-idle');
        const panelActive = document.getElementById('right-panel-active');
        const clockTime = document.getElementById('clock-time');
        const clockDate = document.getElementById('clock-date');
        const scanFeedback = document.getElementById('scan-feedback');
        
        // Elementos del Docente
        const teacherName = document.getElementById('teacher-name');
        const teacherDni = document.getElementById('teacher-dni');
        const teacherPhoto = document.getElementById('teacher-photo');
        const attendanceActions = document.getElementById('attendance-actions');
        const resetProgress = document.getElementById('reset-progress');

        let qrScanned = false;
        let autoResetTimer = null;

        // --- RELOJ EN TIEMPO REAL ---
        function updateClock() {
            const now = new Date();
            clockTime.textContent = now.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', hour12: false }); // Formato 24h más limpio
            clockDate.textContent = now.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- SISTEMA DE CAMBIO DE ESTADO (UI SWITCHER) ---
        function setKioskState(state) {
            if (state === 'active') {
                panelIdle.classList.remove('visible-state');
                panelIdle.classList.add('hidden-state');
                
                panelActive.classList.remove('hidden-state');
                panelActive.classList.add('visible-state');
                
                // Iniciar timer de auto-reset visual
                resetProgress.style.transition = 'none';
                resetProgress.style.transform = 'scaleX(1)';
                setTimeout(() => {
                    resetProgress.style.transition = 'transform 10s linear';
                    resetProgress.style.transform = 'scaleX(0)';
                }, 50);
                
                clearTimeout(autoResetTimer);
                autoResetTimer = setTimeout(resetKiosk, 10000); // 10 segundos
                
            } else { // 'idle'
                panelActive.classList.remove('visible-state');
                panelActive.classList.add('hidden-state');
                
                panelIdle.classList.remove('hidden-state');
                panelIdle.classList.add('visible-state');
                
                clearTimeout(autoResetTimer);
                
                // Limpieza
                teacherName.textContent = '';
                teacherDni.textContent = '';
                teacherPhoto.src = '';
                attendanceActions.innerHTML = '';
                scanFeedback.textContent = '';
                rfidInput.value = '';
                rfidInput.focus();
                
                // Reactivar escáner
                qrScanned = false;
                requestAnimationFrame(tick);
            }
        }

        function resetKiosk() {
            setKioskState('idle');
        }

        // --- CÁMARA Y QR ---
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                requestAnimationFrame(tick);
            })
            .catch(err => {
                console.error("Error cámara:", err);
                scanFeedback.textContent = "⚠️ Error: No se detecta la cámara.";
                scanFeedback.classList.add('text-red-500');
            });

        function tick() {
            if (qrScanned) return; // Pausar procesamiento si ya detectó algo
            
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                
                if (code) {
                    qrScanned = true; // Bloqueo temporal
                    handleQRCode(code.data);
                }
            }
            requestAnimationFrame(tick);
        }

        // --- ALERTA VISUAL (TOAST) ---
        function showKioskAlert(message, type = 'success') {
            const alertBox = document.getElementById('kiosk-alert');
            const alertContent = document.getElementById('kiosk-alert-content');
            const alertIcon = document.getElementById('kiosk-alert-icon');
            const alertMsg = document.getElementById('kiosk-alert-message');

            // Reset clases
            alertContent.className = 'flex items-center gap-4 px-6 py-4 rounded-xl shadow-2xl backdrop-blur-xl border min-w-[320px] justify-center transition-colors duration-300';
            
            if (type === 'success') {
                alertContent.classList.add('bg-emerald-500/90', 'border-emerald-400', 'text-white');
                alertIcon.className = 'fa-solid fa-circle-check';
            } else if (type === 'warning') {
                alertContent.classList.add('bg-amber-500/90', 'border-amber-400', 'text-white');
                alertIcon.className = 'fa-solid fa-triangle-exclamation';
            } else {
                alertContent.classList.add('bg-rose-600/90', 'border-rose-500', 'text-white');
                alertIcon.className = 'fa-solid fa-circle-xmark';
            }

            alertMsg.textContent = message;
            
            // Animación de entrada
            alertBox.classList.remove('-translate-y-32', 'opacity-0');
            
            // Animación de salida automática
            setTimeout(() => {
                alertBox.classList.add('-translate-y-32', 'opacity-0');
            }, 4000);
        }

        // --- API CALLS ---
        function getCsrfToken() {
            return document.querySelector('input[name="csrfmiddlewaretoken"]').value;
        }

        async function handleQRCode(qrId) {
            scanFeedback.textContent = "🔍 Procesando Código QR...";
            try {
                const response = await fetch('/api/get-teacher-info/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
                    body: JSON.stringify({ qrId: qrId })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'Error desconocido');
                
                displayInfoAndActions(data);
                
            } catch (error) {
                console.error(error);
                scanFeedback.textContent = "❌ " + error.message;
                showKioskAlert(error.message, 'error');
                setTimeout(() => { 
                    qrScanned = false; 
                    scanFeedback.textContent = "";
                    requestAnimationFrame(tick); // Reintentar
                }, 3000);
            }
        }

        // --- RFID LOGIC ---
        rfidInput.addEventListener('blur', () => setTimeout(() => rfidInput.focus(), 10));
        
        // Efecto visual cuando el RFID está activo
        rfidInput.addEventListener('focus', () => {
            document.getElementById('rfid-status').classList.remove('opacity-50');
            document.getElementById('rfid-status').classList.add('opacity-100', 'animate-pulse');
        });

        rfidInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const uid = rfidInput.value.trim();
                if (uid) {
                    qrScanned = true; // Bloquear cámara mientras procesa RFID
                    handleRFID(uid);
                }
            }
        });

        async function handleRFID(uid) {
            scanFeedback.textContent = "📡 Leyendo tarjeta...";
            try {
                const response = await fetch('/api/asistencia_rfid/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
                    body: JSON.stringify({ uid: uid })
                });
                const data = await response.json();
                if (!response.ok && response.status !== 404) throw new Error(data.message);
                
                displayInfoAndActions(data);
                
            } catch (error) {
                showKioskAlert(error.message, 'error');
                setTimeout(resetKiosk, 2000);
            } finally {
                rfidInput.value = '';
            }
        }

        // --- GENERADOR DE BOTONES Y UI ---
        function createActionButton(text, colorClass, iconClass, onClick) {
            const btn = document.createElement('button');
            btn.className = `w-full p-6 rounded-2xl flex items-center justify-between transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-lg animate-fade-in-up mb-3 ${colorClass}`;
            
            btn.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm">
                        <i class="fa-solid ${iconClass} text-2xl"></i>
                    </div>
                    <span class="text-xl font-bold tracking-wide">${text}</span>
                </div>
                <i class="fa-solid fa-chevron-right opacity-50"></i>
            `;
            btn.onclick = onClick;
            return btn;
        }

        function createInfoCard(title, subtitle, iconClass, colorText = 'text-slate-400') {
            const div = document.createElement('div');
            div.className = "w-full bg-slate-800/50 border border-slate-700 p-4 rounded-xl flex items-center gap-4 animate-fade-in-up mb-3";
            div.innerHTML = `
                <i class="fa-solid ${iconClass} text-xl ${colorText}"></i>
                <div>
                    <h4 class="font-bold text-white">${title}</h4>
                    <p class="text-sm ${colorText}">${subtitle}</p>
                </div>
            `;
            return div;
        }

        function displayInfoAndActions(data) {
            if (data.status === 'error' || data.status === 'weekend_off') {
                showKioskAlert(data.message, data.status === 'weekend_off' ? 'warning' : 'error');
                setTimeout(resetKiosk, 4000);
                return;
            }

            // Llenar datos del docente
            teacherName.textContent = data.teacher.name;
            teacherDni.textContent = `ID: ${data.teacher.dni}`;
            teacherPhoto.src = data.teacher.photoUrl || '/static/placeholder.png'; // Fallback image

            // Limpiar acciones previas
            attendanceActions.innerHTML = '';

            // --- LÓGICA DE BOTONES ---
            let dailyEntryMarked = data.dailyAttendance?.entryMarked || data.isDailyAttendanceMarked;
            let dailyExitMarked = data.dailyAttendance?.exitMarked;

            // 1. ASISTENCIA GENERAL
            const sectionTitle = document.createElement('h3');
            sectionTitle.className = "text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 mt-2 pl-1";
            sectionTitle.textContent = "Registro Diario";
            attendanceActions.appendChild(sectionTitle);

            if (!dailyEntryMarked) {
                attendanceActions.appendChild(createActionButton(
                    'Marcar Entrada', 
                    'bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white', 
                    'fa-sun', 
                    () => markAttendance('general_entry', data.qrId)
                ));
            } else if (!dailyExitMarked) {
                attendanceActions.appendChild(createInfoCard(
                    'Entrada Registrada', 
                    `Hora: ${data.dailyAttendance?.entryTime || 'Registrada'}`, 
                    'fa-check-circle', 
                    'text-emerald-400'
                ));
                attendanceActions.appendChild(createActionButton(
                    'Marcar Salida', 
                    'bg-gradient-to-r from-orange-600 to-orange-500 hover:from-orange-500 hover:to-orange-400 text-white', 
                    'fa-person-walking-arrow-right', 
                    () => markAttendance('general_exit', data.qrId)
                ));
            } else {
                attendanceActions.appendChild(createInfoCard(
                    'Jornada Finalizada', 
                    'Entrada y salida registradas correctamente.', 
                    'fa-clipboard-check', 
                    'text-emerald-400'
                ));
            }

            // 2. ASISTENCIA POR CURSOS
            if (data.courses && data.courses.length > 0) {
                const coursesTitle = sectionTitle.cloneNode(true);
                coursesTitle.textContent = "Cursos Programados Hoy";
                coursesTitle.className += " mt-6";
                attendanceActions.appendChild(coursesTitle);

                data.courses.forEach(course => {
                    const courseCard = document.createElement('div');
                    courseCard.className = "bg-slate-800 border border-slate-700 rounded-2xl p-5 mb-3 animate-fade-in-up";
                    
                    let actionButtonHTML = '';
                    
                    if (!course.entryMarked) {
                        actionButtonHTML = `<button onclick="markAttendance('course_entry', '${data.qrId}', ${course.id})" class="w-full mt-3 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold text-sm transition-colors flex items-center justify-center gap-2"><i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar al Curso</button>`;
                    } else if (course.exitMarked) {
                        actionButtonHTML = `<div class="mt-3 py-2 bg-slate-700/50 rounded-lg text-center text-sm text-emerald-400 font-medium"><i class="fa-solid fa-check"></i> Asistencia Completa</div>`;
                    } else if (course.canMarkExit) {
                        actionButtonHTML = `<button onclick="markAttendance('course_exit', '${data.qrId}', ${course.id})" class="w-full mt-3 py-3 bg-rose-600 hover:bg-rose-500 rounded-lg font-bold text-sm transition-colors flex items-center justify-center gap-2"><i class="fa-solid fa-arrow-right-from-bracket"></i> Salir del Curso</button>`;
                    } else {
                        actionButtonHTML = `<div class="mt-3 py-2 bg-slate-700/50 rounded-lg text-center text-sm text-blue-400 font-medium"><i class="fa-solid fa-hourglass-half"></i> En clase (Salida: ${course.hora_salida_permitida_str || 'Pendiente'})</div>`;
                    }

                    courseCard.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-lg text-white">${course.name}</h4>
                                <div class="flex items-center gap-2 text-slate-400 text-sm mt-1">
                                    <i class="fa-regular fa-clock"></i>
                                    <span>${course.startTime} - ${course.endTime}</span>
                                </div>
                            </div>
                            <div class="bg-slate-700 px-2 py-1 rounded text-xs text-slate-300 font-mono">LAB-1</div>
                        </div>
                        ${actionButtonHTML}
                    `;
                    attendanceActions.appendChild(courseCard);
                });
            } else if (!data.courses) {
                // Caso sin cursos pero con datos
            } else {
                const noCourses = document.createElement('div');
                noCourses.className = "text-center p-6 text-slate-500 italic";
                noCourses.innerHTML = '<i class="fa-solid fa-calendar-xmark mb-2 text-2xl"></i><br>No hay cursos asignados para hoy.';
                attendanceActions.appendChild(noCourses);
            }

            // Cambiar a vista activa
            setKioskState('active');
        }

        async function markAttendance(actionType, qrId, courseId = null) {
            // Capturar foto
            canvasElement.height = video.videoHeight;
            canvasElement.width = video.videoWidth;
            canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
            const photoBase64 = canvasElement.toDataURL('image/jpeg', 0.7);

            // Feedback de carga en todos los botones
            const buttons = attendanceActions.querySelectorAll('button');
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.add('opacity-50', 'cursor-not-allowed');
                b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Procesando...';
            });

            try {
                const response = await fetch('/api/mark-attendance/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
                    body: JSON.stringify({ qrId, actionType, courseId, photoBase64 })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    const isLate = result.data?.es_tardanza;
                    showKioskAlert(
                        isLate ? 'Entrada registrada con Tardanza ⚠️' : result.message, 
                        isLate ? 'warning' : 'success'
                    );
                    
                    // Resetear después de éxito
                    setTimeout(resetKiosk, 3500);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                showKioskAlert("Error: " + error.message, 'error');
                // Restaurar estado (opcional, o resetear)
                setTimeout(resetKiosk, 3500);
            }
        }

        // --- WEBSOCKETS (Opcional) ---
        // (Mismo código que antes para mantener compatibilidad)
        const socketProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const kioskSocket = new WebSocket(socketProtocol + '//' + window.location.host + '/ws/kiosk/');
        kioskSocket.onmessage = function(e) {
            const eventData = JSON.parse(e.data);
            if (eventData.type === 'kiosk.update') {
                qrScanned = true;
                displayInfoAndActions(eventData.data);
            }
        };
    </script>
</body>
</html>
